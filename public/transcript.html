<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Better Call Ron — Live</title>
  <style>
    :root {
      --bg: #0b0d12;
      --fg: #f4f6fb;
      --caller-bg: #eef0f5;
      --caller-fg: #0b0d12;
      --agent-bg: #1f2a44;
      --agent-fg: #ffffff;
      --accent: #ff6b35;
      --muted: #8a93a6;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--fg);
      font: 28px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      min-height: 100vh;
    }
    header {
      position: sticky;
      top: 0;
      background: var(--bg);
      padding: 24px 40px;
      border-bottom: 1px solid #1c2030;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 {
      margin: 0;
      font-size: 32px;
      letter-spacing: -0.01em;
    }
    header h1 span { color: var(--accent); }
    .status {
      font-size: 16px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .status.live::before {
      content: "";
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #28d17c;
      margin-right: 8px;
      vertical-align: middle;
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    #log {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 40px 120px;
    }
    .turn {
      display: flex;
      flex-direction: column;
      margin: 16px 0;
      max-width: 78%;
      animation: slide-in 0.25s ease-out;
    }
    @keyframes slide-in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .turn .speaker {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .turn .bubble {
      padding: 18px 24px;
      border-radius: 18px;
      line-height: 1.4;
    }
    .turn.caller {
      align-self: flex-end;
      align-items: flex-end;
    }
    .turn.caller .bubble {
      background: var(--caller-bg);
      color: var(--caller-fg);
      border-bottom-right-radius: 4px;
    }
    .turn.agent {
      align-self: flex-start;
      align-items: flex-start;
    }
    .turn.agent .bubble {
      background: var(--agent-bg);
      color: var(--agent-fg);
      border-bottom-left-radius: 4px;
    }
    .turn.agent .speaker { color: var(--accent); }
    .empty {
      text-align: center;
      color: var(--muted);
      margin-top: 80px;
      font-size: 22px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Better Call <span>Ron</span></h1>
    <div id="status" class="status">connecting...</div>
  </header>
  <div id="log">
    <div class="empty" id="empty">Waiting for the call to start.</div>
  </div>
  <script>
    // Default to the global feed so you can just load /transcript.html and
    // see every call. Pass ?call=<call_id> to filter to a single call.
    const callId = new URLSearchParams(location.search).get("call") || "_all";
    const proto = location.protocol === "https:" ? "wss" : "ws";
    const ws = new WebSocket(`${proto}://${location.host}/transcript/${callId}`);
    const log = document.getElementById("log");
    const status = document.getElementById("status");
    const empty = document.getElementById("empty");

    ws.onopen = () => {
      status.textContent = "live";
      status.classList.add("live");
    };
    ws.onclose = () => {
      status.classList.remove("live");
      status.textContent = "disconnected";
    };
    ws.onerror = () => {
      status.classList.remove("live");
      status.textContent = "error";
    };
    ws.onmessage = (e) => {
      if (empty) empty.remove();
      const msg = JSON.parse(e.data);
      const turn = document.createElement("div");
      turn.className = `turn ${msg.speaker}`;
      const speaker = document.createElement("div");
      speaker.className = "speaker";
      speaker.textContent = msg.speaker === "agent" ? "Ron" : "Caller";
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = msg.text;
      turn.appendChild(speaker);
      turn.appendChild(bubble);
      log.appendChild(turn);
      window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
    };
  </script>
</body>
</html>
